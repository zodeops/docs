openapi: 3.1.0
info:
  title: Zode API
  version: 0.1.0
  description: Sandboxes for coding agents. Every route takes an API key as a bearer token.
servers:
- url: https://api.zode.dev
security:
- bearerAuth: []
tags:
- name: Sandboxes
- name: Commands
- name: Browser and desktop
- name: Snapshots
- name: Images
- name: Environments
- name: Flight recorder
- name: Attestation
- name: Agents
- name: Proxying
- name: Webhooks
- name: OpenTelemetry
- name: Alerts
- name: CI
- name: Usage and billing
- name: Workspace
- name: Platform
paths:
  /v1/whoami:
    get:
      operationId: whoami
      tags:
      - Workspace
      summary: Who am I
      responses:
        '200':
          description: Caller identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmI'
        '401':
          $ref: '#/components/responses/Error'
        '400':
          description: A bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Error'
      description: The org, member and token behind the bearer token.
  /v1/status:
    get:
      operationId: getStatus
      summary: Service status
      description: 'Whether each part of Zode works (public, cached 15 s).


        API (database), sandbox nodes (each active node''s health), egress proxy (nodes advertising egress)
        and flight recorder. `state` is operational only when every component is; down when the API or
        the nodes are; degraded otherwise. Says nothing about any workspace.'
      security: []
      responses:
        '200':
          description: Current status
          content:
            application/json:
              schema:
                type: object
                required:
                - state
                - components
                - checked_at
                properties:
                  state:
                    $ref: '#/components/schemas/ComponentState'
                  checked_at:
                    type: string
                    format: date-time
                  components:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - state
                      properties:
                        id:
                          type: string
                          enum:
                          - api
                          - nodes
                          - proxy
                          - recorder
                        name:
                          type: string
                        state:
                          $ref: '#/components/schemas/ComponentState'
                        detail:
                          type: string
      tags:
      - Platform
  /v1/concurrency:
    get:
      operationId: getConcurrency
      summary: Running sandboxes
      responses:
        '200':
          description: Running count
          content:
            application/json:
              schema:
                type: object
                required:
                - running
                - limit
                - plan
                properties:
                  running:
                    type: integer
                    description: running, creating or starting
                  limit:
                    type:
                    - integer
                    - 'null'
                    description: 'null: no limit on this plan'
                  plan:
                    type: string
      description: Sandboxes running now against the plan's limit (every role).
      tags:
      - Sandboxes
  /v1/sandboxes:
    get:
      operationId: listSandboxes
      tags:
      - Sandboxes
      summary: List sandboxes
      description: 'List the org''s sandboxes that are not deleted, oldest first.


        Optional filters, each a comma-separated list (OR within a list, AND

        across lists). Unknown values are 400 `invalid_request`.'
      parameters:
      - name: status
        in: query
        schema:
          type: string
          example: running,stopped
        description: Sandbox statuses (any but `deleted`).
      - name: region
        in: query
        schema:
          type: string
          example: eu-central
      - name: created_by
        in: query
        schema:
          type: string
          example: me,none
        description: Member ids, `me` (the caller) or `none` (no recorded creator).
      responses:
        '200':
          description: Sandboxes
          content:
            application/json:
              schema:
                type: object
                required:
                - sandboxes
                properties:
                  sandboxes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sandbox'
        '401':
          $ref: '#/components/responses/Error'
        '400':
          description: A bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      operationId: createSandbox
      tags:
      - Sandboxes
      summary: Create a sandbox
      description: 'Placed at random among active nodes in the region with enough free

        RAM (weighted by free RAM). Returns once the node reports the

        sandbox running. An empty body creates a default sandbox.

        The sandbox reads its variables from `?environment=` (an id or a

        name; the workspace''s `default` when absent) at the start of every

        exec and attach session; unknown is 400 `unknown_environment`.

        A fork keeps its parent''s environment.

        '
      parameters:
      - name: environment
        in: query
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSandboxRequest'
      responses:
        '201':
          description: Created and running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '502':
          description: The node failed; the sandbox is left in status `error` and can be deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`no_capacity`: no node in the region has enough free RAM.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Error'
  /v1/sandboxes/{id}:
    get:
      operationId: getSandbox
      tags:
      - Sandboxes
      summary: Get a sandbox
      responses:
        '200':
          description: Sandbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '400':
          description: A bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Error'
      description: Get a sandbox (including deleted ones).
    delete:
      operationId: deleteSandbox
      tags:
      - Sandboxes
      summary: Delete a sandbox
      description: 'Delete a sandbox and its disk.


        Allowed from `running`, `stopped` and `error`.'
      responses:
        '200':
          description: Deleted; the body is the final record with status `deleted`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          description: The node failed; the sandbox is left in `error` and the delete can be retried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: A bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Error'
    parameters:
    - $ref: '#/components/parameters/SandboxID'
  /v1/sandboxes/{id}/fork:
    post:
      operationId: forkSandbox
      tags:
      - Sandboxes
      summary: Fork a sandbox
      description: 'Fork a running or stopped sandbox.


        The child is a ZFS clone on the parent''s host with the parent''s size,

        region and repo. Body fields override metadata only. If the parent''s

        host has no free RAM, 409 `node_full`.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkSandboxRequest'
      responses:
        '201':
          description: Child created and running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    parameters:
    - $ref: '#/components/parameters/SandboxID'
  /v1/sandboxes/{id}/stop:
    post:
      operationId: stopSandbox
      tags:
      - Sandboxes
      summary: Stop a sandbox
      responses:
        '200':
          description: Stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          description: The node failed; the sandbox stays `running`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: A bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Error'
      description: Stop a running sandbox (disk kept, RAM released).
    parameters:
    - $ref: '#/components/parameters/SandboxID'
  /v1/sandboxes/{id}/exec:
    post:
      operationId: execSandbox
      tags:
      - Commands
      summary: Run a command
      description: 'Run one command in a running sandbox and return its output.


        `command` runs under `bash -lc`; `argv` runs as-is. Output is buffered,

        1 MiB per stream. Commands run as root in `/workspace` unless `cwd`

        says otherwise, and are killed after `timeout_ms` (default 30000, max

        55000). Only the program name is written to the audit log.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecRequest'
      responses:
        '200':
          description: The command ran (any exit code)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecResult'
        '400':
          description: A bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '501':
          description: '`exec_unavailable`: the control plane has no node that can run commands.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The node or guest agent failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters:
    - $ref: '#/components/parameters/SandboxID'
  /v1/sandboxes/{id}/attach:
    get:
      operationId: attachSandbox
      tags:
      - Commands
      summary: Open a session (WebSocket)
      description: 'Open an interactive session (WebSocket) in a running sandbox.


        Upgrades to a WebSocket. Every message is binary; its first byte is the

        type and the rest the payload: from the client `i`

        stdin, `e` stdin closed, `r` resize ("rows cols"), `s` signal ("INT");

        from the sandbox `o` stdout, `x` stderr (not with a TTY), `q` exit

        (JSON `{exit_code, signal, timed_out, oom_killed}`) and `!` error, each

        followed by a close. Closing the socket kills the process. Used by

        `zode ssh` and `zode exec`. Browsers on other origins are refused.'
      parameters:
      - name: argv
        in: query
        schema:
          type: array
          items:
            type: string
        description: Program and arguments; a login shell when absent
      - name: tty
        in: query
        schema:
          type: string
          enum:
          - '1'
      - name: rows
        in: query
        schema:
          type: integer
      - name: cols
        in: query
        schema:
          type: integer
      - name: cwd
        in: query
        schema:
          type: string
      responses:
        '101':
          description: Switching to the WebSocket session
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'
        '502':
          description: The node could not start the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters:
    - $ref: '#/components/parameters/SandboxID'
  /v1/sandboxes/{id}/features:
    patch:
      operationId: setSandboxFeatures
      tags:
      - Browser and desktop
      summary: Switch browser or desktop
      description: "Switch the browser or the desktop on or off in a running sandbox.\n\n Off by default;\
        \ processes run only while\non. Each change is audited (`sandbox.browser.enable`, `.disable`,\n\
        `sandbox.desktop.enable`, `.disable`, detail `source: toggle`).\nSwitching off is never gated;\
        \ switching on needs the plan and a host\nthat runs it."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                browser:
                  type: boolean
                desktop:
                  type: boolean
      responses:
        '200':
          description: The sandbox with its switches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: plan_required, or the role may not
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: The sandbox is not running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: feature_unavailable on this host.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: 'node_error: the guest did not start it; the message says why.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters:
    - $ref: '#/components/parameters/SandboxID'
  /v1/sandboxes/{id}/browser:
    get:
      operationId: getSandboxBrowser
      tags:
      - Browser and desktop
      summary: Get a CDP endpoint
      description: 'A CDP endpoint for the sandbox''s Chrome.


        `cdp_url` is the browser-level CDP WebSocket: pass it to

        `chromium.connectOverCDP`, `puppeteer.connect({browserWSEndpoint})` or

        `browser_use.Browser(cdp_url=...)`. Its ticket opens connections until

        `expires_at` (5 minutes); an open connection stays open. `direct` goes

        straight to the sandbox''s host; `relay` goes through this API.

        Audited as `sandbox.browser.connect`.'
      responses:
        '200':
          description: The endpoint.
          content:
            application/json:
              schema:
                type: object
                required:
                - cdp_url
                - transport
                - expires_at
                properties:
                  cdp_url:
                    type: string
                    example: wss://eu-1.nodes.zode.dev/cdp/sbx-abc?t=...
                  transport:
                    type: string
                    enum:
                    - direct
                    - relay
                  expires_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: browser_off, or the sandbox is not running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          $ref: '#/components/responses/Error'
    parameters:
    - $ref: '#/components/parameters/SandboxID'
  /v1/sandboxes/{id}/desktop:
    get:
      operationId: getSandboxDesktop
      tags:
      - Browser and desktop
      summary: Get the desktop size
      responses:
        '200':
          description: The screen.
          content:
            application/json:
              schema:
                type: object
                required:
                - width
                - height
                properties:
                  width:
                    type: integer
                    example: 1280
                  height:
                    type: integer
                    example: 800
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: desktop_off, or the sandbox is not running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/Error'
      description: The desktop's size.
    parameters:
    - $ref: '#/components/parameters/SandboxID'
  /v1/sandboxes/{id}/desktop/session:
    post:
      operationId: startDesktopSession
      tags:
      - Browser and desktop
      summary: Get a live view URL
      description: 'A page that shows the desktop (to embed), watch-only or in control.


        `url` is voxl''s web client for this sandbox (H.264 over a WebSocket,

        decoded with WebCodecs; needs a secure page). Put it in an iframe with

        `allow="clipboard-read; clipboard-write; fullscreen; autoplay"`. Its

        ticket opens the page until `expires_at` (1 hour); the open page

        reconnects by itself. Without `control` the node drops the viewer''s

        input; with it, mouse, keyboard, clipboard and files reach the desktop.

        `direct` is served by the sandbox''s host; `relay` goes through this

        API. Audited as `sandbox.desktop.connect` (detail `control`).'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                control:
                  type: boolean
                  default: false
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema:
                type: object
                required:
                - url
                - transport
                - expires_at
                properties:
                  url:
                    type: string
                    example: https://eu-1.nodes.zode.dev/desktop/sbx-abc/?t=...
                  transport:
                    type: string
                    enum:
                    - direct
                    - relay
                  expires_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'
    parameters:
    - $ref: '#/components/parameters/SandboxID'
  /v1/sandboxes/{id}/desktop/screenshot:
    get:
      operationId: desktopScreenshot
      tags:
      - Browser and desktop
      summary: Take a screenshot
      responses:
        '200':
          description: The screen.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
      description: The desktop as a PNG (computer use).
    parameters:
    - $ref: '#/components/parameters/SandboxID'
  /v1/sandboxes/{id}/desktop/actions:
    post:
      operationId: desktopAction
      tags:
      - Browser and desktop
      summary: Click, type, press keys
      description: 'Move, click, type, press keys or scroll on the desktop (computer use).


        Coordinates are screen pixels. Not audited one by one (they are keystrokes).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              properties:
                action:
                  type: string
                  enum:
                  - move
                  - click
                  - type
                  - key
                  - scroll
                x:
                  type: integer
                  minimum: 0
                y:
                  type: integer
                  minimum: 0
                button:
                  type: string
                  enum:
                  - left
                  - middle
                  - right
                  default: left
                double:
                  type: boolean
                  default: false
                text:
                  type: string
                  maxLength: 10000
                  description: 'type: the characters to type'
                keys:
                  type: string
                  example: ctrl+shift+t
                  description: 'key: modifiers, then one key'
                dx:
                  type: integer
                  minimum: -25
                  maximum: 25
                  description: 'scroll: notches, + is right'
                dy:
                  type: integer
                  minimum: -25
                  maximum: 25
                  description: 'scroll: notches, + is down'
      responses:
        '204':
          description: Done.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
    parameters:
    - $ref: '#/components/parameters/SandboxID'
  /v1/sandboxes/{id}/start:
    post:
      operationId: startSandbox
      tags:
      - Sandboxes
      summary: Start a sandbox
      description: 'Start a stopped sandbox on its host.


        If its host has no free RAM, 409 `node_full` and it stays `stopped`.'
      responses:
        '200':
          description: Running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '400':
          description: A bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Error'
    parameters:
    - $ref: '#/components/parameters/SandboxID'
  /v1/sandboxes/{id}/timeline:
    get:
      operationId: getSandboxTimeline
      tags:
      - Flight recorder
      summary: Read the timeline
      description: 'Read a sandbox''s flight recorder timeline.


        One page of the merged timeline (metrics, process, AI and network rows)

        in (ts, track, event_id) order, read back from the flight recorder.

        Deleted sandboxes stay readable until the recorder purges them.

        Process rows have `source: guest` (reported from inside the VM,

        untrusted); the rest are `host`. Process cmd/cwd come back with

        `sealed: true` when the org key cannot open them. 501

        `recorder_unavailable` when this API has no recorder connected.'
      parameters:
      - $ref: '#/components/parameters/RecorderFrom'
      - $ref: '#/components/parameters/RecorderTo'
      - name: tracks
        in: query
        description: Comma-separated subset of metrics, process, ai, net. Default all four.
        schema:
          type: string
          example: process,ai,net
      - name: cursor
        in: query
        description: The `next` value of a previous page.
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 5000
          default: 500
      responses:
        '200':
          description: A page of timeline entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelinePage'
        '400':
          description: '`invalid_request` (bad window, track, limit or cursor).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'
        '502':
          description: '`recorder_error`: the recorder could not be read.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters:
    - $ref: '#/components/parameters/SandboxID'
  /v1/sandboxes/{id}/stats:
    get:
      operationId: getSandboxStats
      tags:
      - Flight recorder
      summary: Summarize a window
      description: 'Summarize a sandbox''s flight recorder over a window.


        501 `recorder_unavailable` when this API has no recorder connected.'
      parameters:
      - $ref: '#/components/parameters/RecorderFrom'
      - $ref: '#/components/parameters/RecorderTo'
      responses:
        '200':
          description: Totals and peaks for the window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxStats'
        '400':
          description: '`invalid_request` (bad window).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'
        '502':
          description: '`recorder_error`: the recorder could not be read.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters:
    - $ref: '#/components/parameters/SandboxID'
  /v1/sandboxes/{id}/attestation:
    get:
      operationId: getSandboxAttestation
      tags:
      - Attestation
      summary: Attest a sandbox's host
      description: 'Attestation of the host a sandbox runs on (owner, admin, member).


        The host''s own report, relayed unchanged, plus this server''s verdict.

        `zode verify` checks the report itself (Zode release signature,

        Sigstore Rekor inclusion proof, measurements, and on tpm_quoted hosts

        a TPM quote over the caller''s nonce) and does not rely on `verdict`.'
      parameters:
      - $ref: '#/components/parameters/AttestNonce'
      responses:
        '200':
          description: The host's attestation
          content:
            application/json:
              schema:
                type: object
                required:
                - sandbox_id
                - attestation
                properties:
                  sandbox_id:
                    type: string
                  attestation:
                    $ref: '#/components/schemas/HostAttestation'
        '400':
          description: '`invalid_nonce` (not 8 to 32 bytes of hex).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: '`not_placed`: the sandbox is not on a host yet.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: '`attestation_unavailable`: the fleet does not report attestation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: '`host_unreachable`: the host did not answer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters:
    - $ref: '#/components/parameters/SandboxID'
  /v1/regions/{region}/attestation:
    get:
      operationId: getRegionAttestation
      tags:
      - Attestation
      summary: Attest a region
      description: 'Attestation of every active host in a region (any role).


        `zode verify <region>`. Hosts are named by a short hash, never by

        node id. A host that does not answer is listed with class `none`.'
      parameters:
      - $ref: '#/components/parameters/AttestNonce'
      responses:
        '200':
          description: The region's hosts
          content:
            application/json:
              schema:
                type: object
                required:
                - region
                - hosts
                properties:
                  region:
                    type: string
                  hosts:
                    type: array
                    items:
                      $ref: '#/components/schemas/HostAttestation'
        '400':
          description: '`invalid_nonce`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '501':
          description: '`attestation_unavailable`: the fleet does not report attestation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters:
    - name: region
      in: path
      required: true
      schema:
        type: string
        example: eu-central
  /v1/images:
    get:
      operationId: listImages
      tags:
      - Images
      summary: List images
      description: 'Base images the fleet can boot, and the workspace''s custom images (owner, admin,
        member).


        One golden image per sandbox size; the first is the default. `fixed`

        is false on a development fleet that takes any shape within the

        create limits, and `images` is then empty. `regions` are those with

        an active node this workspace may use. `custom` are the workspace''s

        own images, newest first, with the plan''s

        `limits`; `can_build` is false until a node builds images.'
      responses:
        '200':
          description: Images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Images'
        '400':
          description: A bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      operationId: createImage
      tags:
      - Images
      summary: Build an image
      description: 'Build a custom image (owner, admin, member).


        Builds a golden image from a Dockerfile or from a base plus setup

        commands. The node boots a build VM from the

        base image of the asked size (the default size when none is given),

        runs the steps with the workspace''s egress policy and no host access,

        and freezes it with its memory. The build runs in the background:

        202 returns the image `building`; follow `GET /v1/images/{id}/logs`.

        Every sandbox made from the image has its size and region.

        Plan limits (`limits` in GET /v1/images): 409 `limit_reached`.

        400 `invalid_image` names the Dockerfile line that cannot be built.

        Audited `image.create`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImageRequest'
      responses:
        '202':
          description: Build started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomImage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/images/{id}:
    get:
      operationId: getImage
      tags:
      - Images
      summary: Get an image
      responses:
        '200':
          description: Image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomImage'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      description: A custom image with its Dockerfile or setup (owner, admin, member).
    delete:
      operationId: deleteImage
      tags:
      - Images
      summary: Delete an image
      description: 'Cancel a build or delete an image (owner, admin, member).


        Sandboxes already made from the image keep running. Audited `image.delete`.'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
    parameters:
    - name: id
      in: path
      required: true
      description: An image id (img_...) or name.
      schema:
        type: string
  /v1/images/{id}/logs:
    get:
      operationId: getImageLogs
      tags:
      - Images
      summary: Read a build log
      description: 'The build log from a byte offset (owner, admin, member).


        Poll with `offset` = the last `next` until `done`. Only the newest

        512 KB are kept; `from` is later than `offset` when older bytes were

        dropped.'
      parameters:
      - name: offset
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 0
      responses:
        '200':
          description: Log text
          content:
            application/json:
              schema:
                type: object
                required:
                - text
                - from
                - next
                - status
                - done
                properties:
                  text:
                    type: string
                  from:
                    type: integer
                    format: int64
                  next:
                    type: integer
                    format: int64
                  status:
                    type: string
                    enum:
                    - building
                    - ready
                    - failed
                  done:
                    type: boolean
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    parameters:
    - name: id
      in: path
      required: true
      description: An image id (img_...) or name.
      schema:
        type: string
  /v1/snapshots:
    get:
      operationId: listSnapshots
      tags:
      - Snapshots
      summary: List snapshots
      description: 'The workspace''s named snapshots, newest first (owner, admin, member).


        `available` is false when no node of the fleet can take snapshots

        yet. `sandbox` narrows the list to one sandbox.'
      parameters:
      - name: sandbox
        in: query
        schema:
          type: string
          pattern: ^sbx_[a-z2-7]{16}$
      responses:
        '200':
          description: Snapshots
          content:
            application/json:
              schema:
                type: object
                required:
                - snapshots
                - available
                - max_per_sandbox
                properties:
                  snapshots:
                    type: array
                    items:
                      $ref: '#/components/schemas/Snapshot'
                  available:
                    type: boolean
                  max_per_sandbox:
                    type: integer
                    const: 20
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      operationId: createSnapshot
      tags:
      - Snapshots
      summary: Take a snapshot
      description: 'Snapshot a running or stopped sandbox, disk and RAM (owner, admin, member).


        A running sandbox is paused for the RAM write (a few seconds) and

        resumed. Snapshots always include RAM: nodes restore sandboxes from

        RAM images only, so `include_ram: false` is 400. `name` defaults to

        `snapshot-<UTC time>` and is unique among the sandbox''s snapshots

        (409 `name_taken`); 20 per sandbox (409 `limit_reached`). 409

        `invalid_state` unless running or stopped, 501

        `snapshots_unavailable` when its node cannot snapshot, 502

        `node_error`. Audited `snapshot.create`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - sandbox_id
              properties:
                sandbox_id:
                  type: string
                  pattern: ^sbx_[a-z2-7]{16}$
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                include_ram:
                  type: boolean
                  const: true
      responses:
        '201':
          description: Taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /v1/snapshots/{id}:
    delete:
      operationId: deleteSnapshot
      tags:
      - Snapshots
      summary: Delete a snapshot
      description: 'Delete a snapshot (owner, admin, member).


        Its ZFS snapshots go on the node (deferred while a restored disk still clones them). Audited `snapshot.delete`.'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^snp_[a-z2-7]{16}$
  /v1/snapshots/{id}/restore:
    post:
      operationId: restoreSnapshot
      tags:
      - Snapshots
      summary: Restore a snapshot
      description: 'Roll the sandbox back to a snapshot, disk and RAM (owner, admin, member).


        A running sandbox is hibernated, rolled back and started from the

        snapshot; a stopped one stays stopped and starts from it next time.

        What the sandbox did after the snapshot is lost unless snapshotted

        too; later snapshots and forks are kept. The sandbox reads

        `starting` while the node works. 409 `invalid_state` unless running

        or stopped, 501 `snapshots_unavailable`, 502 `node_error`. Audited

        `snapshot.restore`.'
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                type: object
                required:
                - snapshot
                - sandbox
                properties:
                  snapshot:
                    $ref: '#/components/schemas/Snapshot'
                  sandbox:
                    type: object
                    description: The sandbox, as GET /v1/sandboxes/{id} shows it
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '501':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^snp_[a-z2-7]{16}$
  /v1/audit:
    get:
      operationId: listAudit
      tags:
      - Workspace
      summary: Read the audit log
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      - name: before
        in: query
        description: Return events with id below this (use `next_before` from the previous page).
        schema:
          type: integer
          format: int64
          minimum: 1
      - $ref: '#/components/parameters/AuditActor'
      - $ref: '#/components/parameters/AuditAction'
      - $ref: '#/components/parameters/AuditTarget'
      - $ref: '#/components/parameters/AuditFrom'
      - $ref: '#/components/parameters/AuditTo'
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: object
                required:
                - events
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  next_before:
                    type: integer
                    format: int64
                    description: Present when the page is full; pass as `before` for the next page.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      description: The org's audit events, newest first (owner, admin).
  /v1/audit.csv:
    get:
      operationId: exportAudit
      tags:
      - Workspace
      summary: Export the audit log
      parameters:
      - $ref: '#/components/parameters/AuditActor'
      - $ref: '#/components/parameters/AuditAction'
      - $ref: '#/components/parameters/AuditTarget'
      - $ref: '#/components/parameters/AuditFrom'
      - $ref: '#/components/parameters/AuditTo'
      responses:
        '200':
          description: 'Columns: id, time_utc, actor, ip, action, outcome, target_type, target_id, detail'
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '402':
          description: '`plan_required`: export comes with the Team plan'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Error'
      description: The filtered audit log as CSV, newest first, at most 50,000 rows (owner, admin; Team
        and Enterprise plans).
  /v1/usage:
    get:
      operationId: getUsage
      tags:
      - Usage and billing
      summary: Get usage
      description: 'Workspace usage for a range of UTC days (every role).


        Totals, a daily series and a group-by table. Compute and storage are

        sums of ledger lines (stored lines for rolled-up days, metered live

        for the rest); AI spend and OOM kills come from the flight recorder

        and are null/absent when it is not connected (`recorder`). Totals

        equal the sum of the series, of the groups and of the CSV rows, and

        `zode cost` prints these totals.'
      parameters:
      - $ref: '#/components/parameters/UsageFrom'
      - $ref: '#/components/parameters/UsageTo'
      - $ref: '#/components/parameters/UsageGroupBy'
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema:
                type: object
                required:
                - from
                - to
                - as_of
                - group_by
                - totals
                - series
                - groups
                - ai_by_model
                - ai_billed
                - recorder
                - price_versions
                properties:
                  from:
                    type: string
                    format: date
                  to:
                    type: string
                    format: date
                  as_of:
                    type: string
                    format: date-time
                    description: The range end
                    clipped to now.: null
                  group_by:
                    type: string
                    enum:
                    - repo
                    - branch
                    - pr
                    - member
                    - sandbox
                    - model
                  totals:
                    type: object
                    properties:
                      billable_micros:
                        type: integer
                        format: int64
                      compute_micros:
                        type: integer
                        format: int64
                      storage_micros:
                        type: integer
                        format: int64
                      static_ip_micros:
                        type: integer
                        format: int64
                      ai_micros:
                        type: integer
                        format: int64
                        description: Shown
                        not billed.: null
                      ai_calls:
                        type: integer
                        format: int64
                      sandbox_hours:
                        type: number
                      vcpu_hours:
                        type: number
                      peak_concurrent:
                        type: integer
                      forks:
                        type: integer
                      fork_p95_ms:
                        type:
                        - integer
                        - 'null'
                        format: int64
                        description: Creating to running of forks in the range; null with no samples.
                      fork_samples:
                        type: integer
                      oom_kills:
                        type:
                        - integer
                        - 'null'
                        format: int64
                        description: Null when the recorder is off or failed.
                      breaker_trips:
                        type: integer
                      caps_reached:
                        type: integer
                  series:
                    type: array
                    description: One entry per day of the range, zeros included.
                    items:
                      type: object
                      properties:
                        day:
                          type: string
                          format: date
                        billable_micros:
                          type: integer
                          format: int64
                        compute_micros:
                          type: integer
                          format: int64
                        storage_micros:
                          type: integer
                          format: int64
                        static_ip_micros:
                          type: integer
                          format: int64
                        ai_micros:
                          type: integer
                          format: int64
                        ai_calls:
                          type: integer
                          format: int64
                        sandbox_hours:
                          type: number
                        peak_concurrent:
                          type: integer
                        forks:
                          type: integer
                  groups:
                    type: array
                    description: Most expensive first. Key "" is unattributed usage (no repo, branch or
                      PR; by model, compute and storage).
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        label:
                          type: string
                        billable_micros:
                          type: integer
                          format: int64
                        compute_micros:
                          type: integer
                          format: int64
                        storage_micros:
                          type: integer
                          format: int64
                        static_ip_micros:
                          type: integer
                          format: int64
                        ai_micros:
                          type: integer
                          format: int64
                        ai_calls:
                          type: integer
                          format: int64
                        sandbox_hours:
                          type: number
                  ai_by_model:
                    type: array
                    items:
                      type: object
                      properties:
                        provider:
                          type: string
                        model:
                          type: string
                        calls:
                          type: integer
                          format: int64
                        cost_micros:
                          type: integer
                          format: int64
                  ai_billed:
                    type: boolean
                  recorder:
                    type: string
                    enum:
                    - 'on'
                    - 'off'
                    - error
                  price_versions:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /v1/usage.csv:
    get:
      operationId: exportUsage
      tags:
      - Usage and billing
      summary: Export usage as CSV
      parameters:
      - $ref: '#/components/parameters/UsageFrom'
      - $ref: '#/components/parameters/UsageTo'
      - $ref: '#/components/parameters/UsageGroupBy'
      responses:
        '200':
          description: 'Columns: day, <group_by>, sandbox_hours, compute_micros, storage_micros, static_ip_micros,
            billable_micros, ai_micros_not_billed, ai_calls'
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      description: The same range as CSV, one row per day and group (every role).
  /v1/billing:
    get:
      operationId: getBilling
      tags:
      - Usage and billing
      summary: Get billing
      responses:
        '200':
          description: Billing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Billing'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      description: Plan, this month's usage and invoice estimate, credit, caps, billing email (owner,
        admin, billing).
    patch:
      operationId: patchBilling
      tags:
      - Usage and billing
      summary: Change caps and billing
      description: 'Change caps, auto top-up, billing email or plan (owner, billing).


        Absent fields are unchanged; a cap set to null is removed. Auto

        top-up and plan changes need a payment provider: without one they

        answer 409 `billing_not_open`. Auto top-up adds $5 to $1,000 in

        whole cents. `plan` moves an existing Stripe subscription (or

        cancels it for `free`); the org''s plan changes only when Stripe''s

        `customer.subscription.*` webhook confirms it. A paid plan without

        a subscription answers 409 `checkout_required`: use

        POST /v1/billing/checkout. Audited as `billing.update`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                daily_cap_micros:
                  type:
                  - integer
                  - 'null'
                  format: int64
                  minimum: 1
                  maximum: 100000000000
                sandbox_default_cap_micros:
                  type:
                  - integer
                  - 'null'
                  format: int64
                  minimum: 1
                  maximum: 100000000000
                auto_top_up:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    threshold_micros:
                      type: integer
                      format: int64
                    amount_micros:
                      type: integer
                      format: int64
                billing_email:
                  type: string
                  description: '"" clears it (the owner gets the mail).'
                plan:
                  type: string
      responses:
        '200':
          description: Billing after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Billing'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /v1/billing/invoices:
    get:
      operationId: billingInvoices
      tags:
      - Usage and billing
      summary: List invoices
      responses:
        '200':
          description: Invoices, newest first
          content:
            application/json:
              schema:
                type: object
                required:
                - invoices
                properties:
                  invoices:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        number:
                          type: string
                        status:
                          type: string
                        total_cents:
                          type: integer
                          format: int64
                        currency:
                          type: string
                        period_start:
                          type: string
                          format: date-time
                        period_end:
                          type: string
                          format: date-time
                        created_at:
                          type: string
                          format: date-time
                        hosted_url:
                          type: string
                        pdf_url:
                          type: string
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
      description: Provider invoices with PDF links (owner, admin, billing).
  /v1/org:
    get:
      operationId: getOrg
      tags:
      - Workspace
      summary: Get the workspace
      responses:
        '200':
          description: Workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgDetail'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      description: The workspace (any role).
    patch:
      operationId: updateOrg
      tags:
      - Workspace
      summary: Change the workspace
      description: 'Change the display name, slug or billing email (owner, admin).


        Any subset of the fields; `billing_email` `""` clears it. Audited as

        `org.update` with each changed field''s old and new value.

        Errors: 400 `invalid_request` (bad slug, empty or long display name,

        bad email), 409 `name_taken`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgRequest'
      responses:
        '200':
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgDetail'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /v1/members:
    get:
      operationId: listMembers
      tags:
      - Workspace
      summary: List members
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                required:
                - members
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      description: The workspace's members, owner first, then by joined time (any role).
  /v1/members/{id}:
    patch:
      operationId: updateMember
      tags:
      - Workspace
      summary: Change a member's role
      description: 'Change a member''s role (owner, admin).


        `owner` is never set here (400 `use_transfer`); changing yourself is

        400 `self`. Admins may change only billing and member roles and

        cannot grant admin (403). Another org''s or a removed member is 404.

        Audited as `member.update`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - role
              properties:
                role:
                  type: string
                  enum:
                  - admin
                  - billing
                  - member
      responses:
        '200':
          description: The member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeMember
      tags:
      - Workspace
      summary: Remove a member
      description: 'Remove a member, or leave (your own id).


        Soft-removes the member and revokes every API token they hold in

        this workspace, in one transaction; sandboxes they started keep

        running. Their access ends at once. Anyone but the owner may leave

        (the owner gets 400 `owner_cannot_leave`); the owner may remove

        anyone else; an admin only billing and member roles; the owner can

        never be removed by someone else (403). Audited as `member.remove`

        or `member.leave`.'
      responses:
        '204':
          description: Removed
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^mem_[a-z2-7]{16}$
  /v1/invites:
    get:
      operationId: listInvites
      tags:
      - Workspace
      summary: List invites
      responses:
        '200':
          description: Invites
          content:
            application/json:
              schema:
                type: object
                required:
                - invites
                properties:
                  invites:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      description: Pending invites (not accepted, revoked or expired), newest first (owner, admin).
    post:
      operationId: createInvite
      tags:
      - Workspace
      summary: Invite someone
      description: 'Invite an email address (owner, admin).


        Mails `<inviter> invited you to <display_name> on Zode` with a link

        `https://console.zode.dev/invite?token=<token>`. The token (32 random

        bytes, base64url) is single use, valid 7 days, stored as SHA-256 only

        and never returned or audited. No member row exists until it is

        accepted. Admins cannot invite as admin (403). Errors: 400

        `invalid_email`, `invalid_request` (role), `personal_workspace`; 409

        `already_member`, `invite_pending` (resend it instead); 429

        `rate_limited` (30 invite mails per workspace per hour, resends

        included); 503 `email_unavailable`. Audited as `invite.create`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              - role
              properties:
                email:
                  type: string
                  description: Lowercased and trimmed.
                role:
                  type: string
                  enum:
                  - admin
                  - billing
                  - member
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Error'
  /v1/invites/{id}/resend:
    post:
      operationId: resendInvite
      tags:
      - Workspace
      summary: Resend an invite
      description: 'Mail a new token with a fresh 7-day expiry (owner, admin).


        Works on an open invite, expired or not; the old token stops

        working. Counts against the invite rate limit. Audited as

        `invite.resend`.'
      responses:
        '200':
          description: Resent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Error'
    parameters:
    - $ref: '#/components/parameters/InviteID'
  /v1/invites/{id}:
    delete:
      operationId: revokeInvite
      tags:
      - Workspace
      summary: Revoke an invite
      description: 'Revoke an open invite (owner, admin).


        Audited as `invite.revoke`. Unknown, accepted or revoked invites are 404.'
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    parameters:
    - $ref: '#/components/parameters/InviteID'
  /v1/alerts:
    get:
      operationId: getAlerts
      tags:
      - Alerts
      summary: Get alert settings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: object
                required:
                - time_zone
                - secrets_ready
                - email_ready
                - event_types
                properties:
                  time_zone:
                    type: string
                    description: IANA name; quiet hours use it. Default UTC.
                  secrets_ready:
                    type: boolean
                    description: 'false when ZODE_SECRETS_KEY is unset: only email channels can be added'
                  email_ready:
                    type: boolean
                    description: false when the server has no mailer
                  event_types:
                    type: array
                    items:
                      type: object
                      required:
                      - type
                      - label
                      - critical
                      - source
                      properties:
                        type:
                          type: string
                        label:
                          type: string
                        critical:
                          type: boolean
                          description: Never held by quiet hours.
                        source:
                          type: string
                          enum:
                          - node
                          - billing
                          - audit
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      description: Alert settings and the event types rules can route (every role).
    patch:
      operationId: patchAlerts
      tags:
      - Alerts
      summary: Set the time zone
      description: 'Set the alert time zone (owner, admin).


        Audited as `alert_settings.update`. 400 `invalid_request` for an unknown zone.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                time_zone:
                  type: string
      responses:
        '200':
          description: Settings, same shape as GET
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /v1/alerts/channels:
    get:
      operationId: listAlertChannels
      tags:
      - Alerts
      summary: List channels
      responses:
        '200':
          description: Channels
          content:
            application/json:
              schema:
                type: object
                required:
                - channels
                properties:
                  channels:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - kind
                      - name
                      - secret_hint
                      - created_at
                      - updated_at
                      - last_test
                      properties:
                        id:
                          type: string
                          example: ach_abcdefghijklmnop
                        kind:
                          type: string
                          enum:
                          - email
                          - slack
                          - discord
                          - telegram
                          - webhook
                        name:
                          type: string
                        members:
                          type: string
                          enum:
                          - managers
                          - all
                          description: email only
                        addresses:
                          type: array
                          items:
                            type: string
                          description: email only
                        chat_id:
                          type: string
                          description: telegram only
                        secret_hint:
                          type: string
                          description: host and last 4 characters, e.g. "hooks.slack.com …x9Qz"
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                        last_test:
                          type:
                          - object
                          - 'null'
                          properties:
                            at:
                              type: string
                              format: date-time
                            ok:
                              type: boolean
                            detail:
                              type: string
                        signing_secret:
                          type: string
                          description: webhook create response only
                          shown once: null
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      description: Alert channels, oldest first (every role); secrets are never returned.
    post:
      operationId: createAlertChannel
      tags:
      - Alerts
      summary: Add a channel
      description: 'Add a channel (owner, admin).


        Fields by kind: email `members` ("" | managers | all) and/or

        `addresses` (up to 20); slack `url` (https://hooks.slack.com/...);

        discord `url` (https://discord.com/api/webhooks/...); telegram

        `bot_token` and `chat_id`; webhook `url` (https, public host). URLs

        and the bot token are write-only, sealed with ZODE_SECRETS_KEY. A

        webhook channel gets a signing secret, returned once as

        `signing_secret`. Errors: 400 `invalid_request`, `too_many` (20 per

        workspace); 503 `secrets_unavailable` (no ZODE_SECRETS_KEY),

        `email_unavailable`. Audited as `alert_channel.create`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - kind
              - name
              properties:
                kind:
                  type: string
                  enum:
                  - email
                  - slack
                  - discord
                  - telegram
                  - webhook
                name:
                  type: string
                  maxLength: 64
                members:
                  type: string
                addresses:
                  type: array
                  items:
                    type: string
                url:
                  type: string
                bot_token:
                  type: string
                chat_id:
                  type: string
      responses:
        '201':
          description: Created, a channel as in the list
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/alerts/channels/{id}:
    patch:
      operationId: updateAlertChannel
      tags:
      - Alerts
      summary: Change a channel
      description: 'Change a channel''s name, recipients or secret (owner, admin).


        Same fields as create, all optional; `kind` cannot change. Audited as `alert_channel.update` (field
        names only).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The channel
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteAlertChannel
      tags:
      - Alerts
      summary: Delete a channel
      responses:
        '200':
          description: '{"deleted": true}'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      description: Delete a channel; it leaves every rule and its queued deliveries go (owner, admin).
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /v1/alerts/channels/{id}/test:
    post:
      operationId: testAlertChannel
      tags:
      - Alerts
      summary: Test a channel
      description: 'Send a test alert now and show the provider''s answer (owner, admin).


        Always 200 when the send was attempted: `ok` says whether the

        provider accepted it, `status` is its HTTP status (0 if none came

        back) and `response` the start of its answer or the error. Stored as

        the channel''s `last_test`. 10 per channel per minute (429). Audited

        as `alert_channel.test`.'
      responses:
        '200':
          description: Attempted
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - status
                - response
                - detail
                - at
                properties:
                  ok:
                    type: boolean
                  status:
                    type: integer
                  response:
                    type: string
                  detail:
                    type: string
                  at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /v1/alerts/rules:
    get:
      operationId: listAlertRules
      tags:
      - Alerts
      summary: List rules
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                type: object
                required:
                - rules
                properties:
                  rules:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - event_type
                      - channel_ids
                      - quiet_hours
                      - enabled
                      - created_at
                      - updated_at
                      properties:
                        id:
                          type: string
                          example: arl_abcdefghijklmnop
                        event_type:
                          type: string
                        channel_ids:
                          type: array
                          items:
                            type: string
                        quiet_hours:
                          type:
                          - object
                          - 'null'
                          properties:
                            start:
                              type: string
                              example: '22:00'
                            end:
                              type: string
                              example: 07:00
                        enabled:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      description: Alert rules, oldest first (every role).
    post:
      operationId: createAlertRule
      tags:
      - Alerts
      summary: Add a rule
      description: 'Route an event type to channels (owner, admin).


        `quiet_hours` (workspace time zone) holds non-critical alerts until

        the window ends; it is refused on critical types. Each rule sends at

        most once per event per channel. Errors: 400 `invalid_request`,

        `unknown_channel`, `too_many` (50 per workspace). Audited as

        `alert_rule.create`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - event_type
              properties:
                event_type:
                  type: string
                channel_ids:
                  type: array
                  items:
                    type: string
                  maxItems: 10
                quiet_hours:
                  type:
                  - object
                  - 'null'
                enabled:
                  type: boolean
                  default: true
      responses:
        '201':
          description: The rule
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /v1/alerts/rules/{id}:
    patch:
      operationId: updateAlertRule
      tags:
      - Alerts
      summary: Change a rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The rule
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      description: Change a rule (owner, admin); `quiet_hours` null clears it.
    delete:
      operationId: deleteAlertRule
      tags:
      - Alerts
      summary: Delete a rule
      responses:
        '200':
          description: '{"deleted": true}'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      description: Delete a rule and its queued deliveries (owner, admin).
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /v1/alerts/deliveries:
