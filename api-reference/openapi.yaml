                        channel_id:
                          type: string
                        event_id:
                          type: string
                        event_type:
                          type: string
                        summary:
                          type: string
                        status:
                          type: string
                          enum:
                          - pending
                          - sent
                          - failed
                        attempts:
                          type: integer
                        next_attempt_at:
                          type:
                          - string
