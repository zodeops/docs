    get:
      operationId: getProxying
      tags:
      - Proxying
      summary: Get keys, breaker and caps
      description: 'Workspace AI key order, loop breaker and spend caps.


        Every role reads; `can_edit` is true for owners and admins. `keys`

        has every provider (possibly empty) in failover order, `position` 0

        first; never the key itself. `limits` gives [min, max] per field and

        `defaults` the values used while `saved` is false. Amounts are

        micro-dollars.'
      responses:
        '200':
          description: Proxying view
          content:
            application/json:
              schema:
                type: object
                required:
                - providers
                - keys
                - loop
                - caps
                - defaults
                - limits
                - saved
                - can_edit
                - secrets_available
                - max_keys_per_provider
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                  keys:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        required:
                        - id
                        - provider
                        - position
                        - label
                        - hint
                        - created_by
                        - created_at
                        properties:
                          id:
                            type: string
                            pattern: ^aik_[a-z2-7]{16}$
                          provider:
                            type: string
                          position:
                            type: integer
                            description: 0 is tried first
                          label:
                            type: string
                          hint:
                            type: string
                            description: Last 4 characters
                          created_by:
                            type: string
                          created_at:
                            type: string
                            format: date-time
                  loop:
                    type: object
                    required:
                    - window_seconds
                    - max_calls
                    - max_spend_micros
                    - max_same_failures
                    properties:
                      window_seconds:
                        type: integer
                      max_calls:
                        type: integer
                      max_spend_micros:
                        type: integer
                      max_same_failures:
                        type: integer
                  caps:
                    type: object
                    required:
                    - sandbox_max_cost_micros
                    - daily_cap_micros
                    - low_balance_micros
                    properties:
                      sandbox_max_cost_micros:
                        type:
                        - integer
                        - 'null'
                      daily_cap_micros:
                        type:
                        - integer
                        - 'null'
                      low_balance_micros:
                        type: integer
                  defaults:
                    type: object
                    properties:
                      loop:
                        type: object
                        required:
                        - window_seconds
                        - max_calls
                        - max_spend_micros
                        - max_same_failures
                        properties:
                          window_seconds:
                            type: integer
                          max_calls:
                            type: integer
                          max_spend_micros:
                            type: integer
                          max_same_failures:
                            type: integer
                      caps:
                        type: object
                        required:
                        - sandbox_max_cost_micros
                        - daily_cap_micros
                        - low_balance_micros
                        properties:
                          sandbox_max_cost_micros:
                            type:
                            - integer
                            - 'null'
                          daily_cap_micros:
                            type:
                            - integer
                            - 'null'
                          low_balance_micros:
                            type: integer
                  limits:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: integer
                      minItems: 2
                      maxItems: 2
                  saved:
                    type: boolean
                  can_edit:
                    type: boolean
                  secrets_available:
                    type: boolean
                  max_keys_per_provider:
                    type: integer
