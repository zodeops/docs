                        response_code:
                          type: integer
                        created_at:
                          type: string
                          format: date-time
                        sent_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      description: The 50 newest alert deliveries (owner, admin).
  /v1/tokens:
    get:
      operationId: listTokens
      tags:
      - Workspace
      summary: List API keys
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                type: object
                required:
                - tokens
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/TokenInfo'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      description: The org's live API tokens, oldest first (never the secret).
    post:
      operationId: createToken
      tags:
      - Workspace
      summary: Create an API key
      description: 'Create an API token for the caller''s member.


        Any console user who is a member of the org may create one (any

        role); an API token caller needs the owner or admin role. The token belongs to the

        caller''s member and is never a platform-admin token. The secret is in

