  /v1/environments/{id}/secrets/{name}:
    put:
      operationId: putSecret
      tags:
      - Environments
      summary: Set a secret
      description: 'Create (201) or replace (200) a secret (owner, admin); the value is write-only.


        `value` is required for a new secret; leave it out to change only the

        allowlist. Sealed with the server key (503 `secrets_unavailable`

        without one). Request-signed keys the vault cannot swap (AWS secret

        keys and the like) are 400 `secret_unsupported`. Up to 50 secrets per

