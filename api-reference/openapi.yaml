          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /v1/proxying/settings:
    patch:
      operationId: patchProxySettings
      tags:
      - Proxying
      summary: Change breaker and caps
      description: 'Change loop breaker thresholds and spend caps (owner, admin).


        Any subset. Out-of-range values are 400 `invalid_request` (ranges in

        GET `limits`). `null` clears `caps.sandbox_max_cost_micros` or

        `caps.daily_cap_micros` (no cap). `reset: true` starts from the

        defaults. Audited as `proxy.settings.update` with old and new values.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reset:
                  type: boolean
                loop:
                  type: object
                  additionalProperties: false
                  properties:
                    max_calls:
                      type: integer
                      minimum: 10
                      maximum: 10000
                    max_spend_micros:
                      type: integer
                      minimum: 500000
                      maximum: 1000000000
                    max_same_failures:
                      type: integer
                      minimum: 3
                      maximum: 100
                caps:
                  type: object
                  additionalProperties: false
                  properties:
                    sandbox_max_cost_micros:
                      type:
                      - integer
                      - 'null'
                      minimum: 100000
                      maximum: 10000000000
                    daily_cap_micros:
                      type:
                      - integer
                      - 'null'
                      minimum: 1000000
                      maximum: 100000000000
                    low_balance_micros:
                      type: integer
                      minimum: 0
                      maximum: 10000000000
      responses:
        '200':
          description: Updated proxying view
          content:
            application/json:
              schema:
                type: object
                required:
                - providers
                - keys
                - loop
                - caps
                - defaults
                - limits
                - saved
                - can_edit
                - secrets_available
                - max_keys_per_provider
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                  keys:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        required:
                        - id
                        - provider
                        - position
                        - label
                        - hint
                        - created_by
                        - created_at
                        properties:
                          id:
                            type: string
                            pattern: ^aik_[a-z2-7]{16}$
                          provider:
                            type: string
                          position:
                            type: integer
                            description: 0 is tried first
                          label:
                            type: string
                          hint:
                            type: string
                            description: Last 4 characters
                          created_by:
                            type: string
                          created_at:
                            type: string
                            format: date-time
                  loop:
                    type: object
                    required:
                    - window_seconds
                    - max_calls
                    - max_spend_micros
                    - max_same_failures
                    properties:
                      window_seconds:
                        type: integer
                      max_calls:
                        type: integer
                      max_spend_micros:
                        type: integer
                      max_same_failures:
                        type: integer
                  caps:
                    type: object
                    required:
                    - sandbox_max_cost_micros
                    - daily_cap_micros
                    - low_balance_micros
                    properties:
                      sandbox_max_cost_micros:
                        type:
                        - integer
                        - 'null'
                      daily_cap_micros:
                        type:
                        - integer
                        - 'null'
                      low_balance_micros:
                        type: integer
                  defaults:
                    type: object
                    properties:
                      loop:
                        type: object
                        required:
                        - window_seconds
                        - max_calls
                        - max_spend_micros
                        - max_same_failures
                        properties:
                          window_seconds:
                            type: integer
                          max_calls:
                            type: integer
                          max_spend_micros:
                            type: integer
                          max_same_failures:
                            type: integer
                      caps:
                        type: object
                        required:
                        - sandbox_max_cost_micros
                        - daily_cap_micros
                        - low_balance_micros
                        properties:
                          sandbox_max_cost_micros:
                            type:
                            - integer
                            - 'null'
                          daily_cap_micros:
                            type:
                            - integer
                            - 'null'
                          low_balance_micros:
                            type: integer
                  limits:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: integer
                      minItems: 2
                      maxItems: 2
                  saved:
                    type: boolean
                  can_edit:
                    type: boolean
                  secrets_available:
                    type: boolean
                  max_keys_per_provider:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: zode_tok_<64 hex chars>
      description: An API key (`zode_tok_...`). Create one in the console under Settings, API keys, or
        with `zode login`.
  parameters:
    AttestNonce:
      name: nonce
      in: query
      required: false
      description: 8 to 32 bytes of hex. On tpm_quoted hosts the TPM quotes the boot PCRs with it, so
        the quote cannot be replayed.
      schema:
        type: string
        pattern: ^([0-9a-fA-F]{2}){8,32}$
    EnvironmentID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^env_[a-z2-7]{16}$
    EnvName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z_][A-Za-z0-9_]{0,127}$
    InviteID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^inv_[a-z2-7]{16}$
    SandboxID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^sbx_[a-z2-7]{16}$
    RecorderFrom:
      name: from
      in: query
      description: Window start, unix milliseconds or RFC 3339. Default one hour before `to`. At most
        31 days before `to`.
      schema:
        type: string
    RecorderTo:
      name: to
      in: query
      description: Window end (exclusive), unix milliseconds or RFC 3339. Default and maximum now.
      schema:
        type: string
    AuditActor:
      name: actor
      in: query
      description: The actor, exactly or as a case-insensitive part (an email, `member:mem_...`, `token:tok_...`).
      schema:
        type: string
        maxLength: 320
    AuditAction:
      name: action
      in: query
      description: Action prefix, e.g. `sandbox.` or `member.remove`.
      schema:
        type: string
        maxLength: 64
    AuditTarget:
      name: target
      in: query
      description: Target id, exactly.
      schema:
        type: string
        maxLength: 128
    AuditFrom:
      name: from
      in: query
      description: Events at or after this UTC day (YYYY-MM-DD) or RFC 3339 instant.
      schema:
        type: string
    AuditTo:
      name: to
      in: query
      description: Events before this RFC 3339 instant, or up to the end of this UTC day (YYYY-MM-DD).
      schema:
        type: string
    UsageFrom:
      name: from
      in: query
      description: First UTC day (YYYY-MM-DD). Default 29 days before `to`.
      schema:
        type: string
        format: date
    UsageTo:
      name: to
      in: query
      description: Last UTC day, inclusive (YYYY-MM-DD). Default today. At most 92 days in all.
      schema:
        type: string
        format: date
    UsageGroupBy:
      name: group_by
      in: query
      schema:
        type: string
        enum:
        - repo
        - branch
        - pr
        - member
        - sandbox
        - model
        default: repo
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: '`rate_limited`'
      headers:
        Retry-After:
          description: Seconds until the window resets.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    HostAttestation:
      type: object
      description: One host's attestation.
      required:
      - host
      - region
      - report
      - verdict
      properties:
        host:
          type: string
          description: Short hash naming the host, e.g. host-1a2b3c4d
        region:
          type: string
        report:
          type: object
          description: What the host reports, unchanged. Verify it yourself with `zode verify`.
          required:
          - class
          properties:
            class:
              type: string
              enum:
              - tpm_quoted
              - signed_image
              - none
            release:
              type: string
            manifest:
              type: string
              format: byte
              description: Release manifest exactly as signed
            manifest_digest:
              type: string
              description: sha256 of manifest
              hex: null
            bundle:
              type: object
              description: Sigstore bundle (v0.3) for the manifest
            measured:
              type: array
              items:
                type: object
                required:
                - name
                - path
                - sha256
                properties:
                  name:
                    type: string
                  path:
                    type: string
                  sha256:
                    type: string
                  error:
                    type: string
            measured_at:
              type: string
              format: date-time
            quote:
              type: object
              description: TPM2 quote over the nonce (tpm_quoted hosts only)
              properties:
                nonce:
                  type: string
                attest:
                  type: string
                  format: byte
                signature:
                  type: string
                  format: byte
                ak_public:
                  type: string
                pcrs:
                  type: object
                  additionalProperties:
                    type: string
            error:
              type: string
        verdict:
          type: object
          description: This server's own check of the report (shown in the console; gates secret delivery
            when required).
          required:
          - ok
          - class
          - claimed
          - checks
          properties:
            ok:
              type: boolean
            class:
              type: string
              enum:
              - tpm_quoted
              - signed_image
              - none
              description: What was proven
              which can be less than claimed: null
            claimed:
              type: string
            release:
              type: string
            manifest_digest:
              type: string
            log:
              type: object
              properties:
                log:
                  type: string
                log_url:
                  type: string
                log_index:
                  type: integer
                tree_size:
                  type: integer
                root_hash:
                  type: string
                integrated_time:
                  type: string
                  format: date-time
                set:
                  type: boolean
            checks:
              type: array
              items:
                type: string
            limits:
              type: array
              items:
                type: string
            problem:
              type: string
    ComponentState:
      type: string
      enum:
      - operational
      - degraded
      - down
      - unknown
    SubscriptionSignIn:
      type: object
      description: One one-click subscription sign-in. Never terminal output.
      required:
      - id
      - harness
      - sandbox_id
      - sandbox_name
      - state
      - url
      - user_code
      - needs_code
      - expires_at
      - error
      properties:
        id:
          type: string
        harness:
          type: string
          enum:
          - claude-code
          - codex
        sandbox_id:
          type: string
        sandbox_name:
          type: string
        state:
          type: string
          enum:
          - starting
          - waiting
          - finishing
          - connected
          - failed
          - expired
          - cancelled
        url:
          type:
          - string
          - 'null'
          description: The provider's sign-in page, as the CLI printed it (provider hosts only)
        user_code:
          type:
          - string
          - 'null'
          description: Codex one-time device code
        needs_code:
          type: boolean
          description: Claude waits for the code its page shows
        expires_at:
          type: string
          format: date-time
        error:
          type:
          - string
          - 'null'
    Billing:
      type: object
      description: 'Plan, this calendar month (UTC) of usage and the invoice the ledger

        would build from it today, credit, caps and the billing email. AI

        spend is shown, not billed (`ai_billed`), and unknown when the

        flight recorder is off (`ai_known`). `provider.configured` is false

        until billing opens: no cards, invoices or plan changes then.

        '
      properties:
        plan:
          type: object
          properties:
            name:
              type: string
              enum:
              - free
              - pro
              - team
              - enterprise
            monthly_fee_micros:
              type: integer
              format: int64
            included_usage_micros:
              type: integer
              format: int64
            signup_credit_micros:
              type: integer
              format: int64
            max_concurrent:
              type: integer
              description: 0 = unlimited
            recorder_days:
              type: integer
        limits:
          type: object
          description: The plan whose limits apply now (Pro during a trial); same fields as `plan`
          properties:
            name:
              type: string
              enum:
              - free
              - pro
              - team
              - enterprise
            monthly_fee_micros:
              type: integer
              format: int64
            included_usage_micros:
              type: integer
              format: int64
            signup_credit_micros:
              type: integer
              format: int64
            max_concurrent:
              type: integer
            recorder_days:
              type: integer
        trial:
          type: object
          properties:
            days:
              type: integer
              description: A new trial's length; 0 when trials are off
            available:
              type: boolean
              description: On Free and never had a trial
            active:
              type: boolean
            plan:
              type: string
            started_at:
              type: string
              format: date-time
            ends_at:
              type: string
              format: date-time
            source:
              type: string
              enum:
              - self
              - promo
        period:
          type: object
          properties:
            start:
              type: string
              format: date
            end:
              type: string
              format: date
              description: Exclusive.
            as_of:
              type: string
              format: date-time
        usage:
          type: object
          properties:
            compute_micros:
              type: integer
              format: int64
            storage_micros:
              type: integer
              format: int64
            static_ip_micros:
              type: integer
              format: int64
            billable_micros:
              type: integer
              format: int64
            ai_micros:
              type: integer
              format: int64
            ai_billed:
              type: boolean
            ai_known:
              type: boolean
        estimate:
          type: object
          properties:
            lines:
              type: array
              items:
                $ref: '#/components/schemas/InvoiceLine'
            informational:
              type: array
              items:
                $ref: '#/components/schemas/InvoiceLine'
            total_micros:
              type: integer
              format: int64
            total_cents:
              type: integer
              format: int64
        credit:
          type: object
          properties:
            balance_micros:
              type: integer
              format: int64
            auto_top_up:
              type: object
              properties:
                enabled:
                  type: boolean
                threshold_micros:
                  type: integer
                  format: int64
                amount_micros:
                  type: integer
                  format: int64
        caps:
          type: object
          properties:
            daily_micros:
              type:
              - integer
              - 'null'
              format: int64
            sandbox_default_micros:
              type:
              - integer
              - 'null'
              format: int64
            today_micros:
              type: integer
              format: int64
        billing_email:
          type: string
        provider:
          type: object
          properties:
            configured:
              type: boolean
            name:
              type: string
            plans:
              type: array
              items:
                type: string
            offers:
              type: array
              description: The terms of each plan in `plans`, in the same order
              items:
                type: object
                properties:
                  name:
                    type: string
                  monthly_fee_micros:
                    type: integer
                    format: int64
                  included_usage_micros:
                    type: integer
                    format: int64
                  signup_credit_micros:
                    type: integer
                    format: int64
                  max_concurrent:
                    type: integer
                  recorder_days:
                    type: integer
        can_manage:
          type: boolean
    InvoiceLine:
      type: object
      properties:
        description:
          type: string
        kind:
          type: string
        micros:
          type: integer
          format: int64
        cents:
          type: integer
          format: int64
          description: Allocated by largest remainder; rows add up to total_cents.
    TimelinePage:
      type: object
      required:
      - entries
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        next:
          type: string
          description: Pass back as `cursor`; absent on the last page.
    TimelineEntry:
      type: object
      required:
      - ts
      - track
      - event_id
      - source
      description: Exactly one of metric, process, ai, net is set, matching `track`.
      properties:
        ts:
          type: string
          format: date-time
        track:
          type: string
          enum:
          - metrics
          - process
          - ai
          - net
        event_id:
          type: string
        source:
          type: string
          enum:
          - guest
          - host
        metric:
          type: object
          properties:
            cpu_pct:
              type: number
            ram_used_mb:
              type: integer
            psi_mem_some:
              type: number
            disk_read_iops:
              type: integer
            disk_write_iops:
              type: integer
            net_rx_bytes:
              type: integer
              description: Bytes in the sample interval.
            net_tx_bytes:
              type: integer
        process:
          type: object
          properties:
            pid:
              type: integer
            cmd:
              type: string
            cwd:
              type: string
            sealed:
              type: boolean
            end_ts:
              type: string
              format: date-time
              description: Zero time while still running.
            exit_code:
              type: integer
            peak_rss_mb:
              type: integer
            oom_killed:
              type: boolean
        ai:
          type: object
          properties:
            git_branch:
              type: string
            provider:
              type: string
            model:
              type: string
            key_id:
              type: string
            failover_attempt:
              type: integer
            input_tokens:
              type: integer
            cached_tokens:
              type: integer
            output_tokens:
              type: integer
            cost_micros:
              type: integer
              format: int64
            latency_ms:
              type: integer
            status_code:
              type: integer
        net:
          type: object
          properties:
            kind:
              type: string
            host:
              type: string
            status_code:
              type: integer
            blocked:
              type: boolean
            reason:
              type: string
            secret_key:
              type: string
              description: Vault key name used
              never its value.: null
    SandboxStats:
      type: object
      properties:
        samples:
          type: integer
        avg_cpu_pct:
          type: number
        max_cpu_pct:
          type: number
        max_ram_mb:
          type: integer
        max_psi_mem_some:
          type: number
        net_rx_bytes:
          type: integer
        net_tx_bytes:
          type: integer
        processes:
          type: integer
        oom_kills:
          type: integer
        net_blocked:
          type: integer
        ai_calls:
          type: integer
        ai_cost_micros:
          type: integer
          format: int64
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: 'Stable machine code. One of: unauthorized, forbidden, not_found,

                bad_request, invalid_request, invalid_state, no_capacity,

                node_full, node_error, confirm_required, already_deleted,

                key_destroy_failed, org_required, name_taken, unhealthy,

                internal.

                '
            message:
              type: string
    SandboxStatus:
      type: string
      enum:
      - creating
      - running
      - stopping
      - stopped
      - starting
      - deleting
      - deleted
      - error
    ExecRequest:
      type: object
      properties:
        command:
          type: string
          maxLength: 16384
          description: Shell command, run with bash -lc
        argv:
          type: array
          items:
            type: string
          description: Program and arguments; ignored when command is set
        cwd:
          type: string
          description: Working directory (default /workspace)
        env:
          type: array
          items:
            type: string
          description: KEY=VALUE entries; replaces the environment
        stdin:
          type: string
          maxLength: 1048576
        timeout_ms:
          type: integer
          minimum: 0
          maximum: 55000
    ExecResult:
      type: object
      required:
      - exit_code
      - stdout
      - stderr
      - duration_ms
      properties:
        exit_code:
          type: integer
          description: -1 when killed by a signal
        signal:
          type: string
        timed_out:
          type: boolean
        oom_killed:
          type: boolean
        peak_rss_mb:
          type: number
        duration_ms:
          type: integer
        stdout:
          type: string
        stderr:
          type: string
        stdout_truncated:
          type: boolean
        stderr_truncated:
          type: boolean
    Sandbox:
      type: object
      required:
      - id
      - name
      - status
      - vcpus
      - ram_mb
      - disk_gb
      - region
      - git_repo
      - git_branch
      - pr_number
      - max_cost_micros
      - parent_sandbox_id
      - created_at
      - updated_at
      - deleted_at
      - created_by
      properties:
        id:
          type: string
          example: sbx_ilvsd743b36wqi26
        name:
          type: string
        status:
          $ref: '#/components/schemas/SandboxStatus'
        vcpus:
          type: integer
        ram_mb:
          type: integer
        disk_gb:
          type: integer
        region:
          type: string
          example: eu-central
        git_repo:
          type: string
        git_branch:
          type: string
        pr_number:
          type:
          - integer
          - 'null'
        max_cost_micros:
          type:
          - integer
          - 'null'
          format: int64
        parent_sandbox_id:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        browser:
          type: boolean
          description: Chrome with CDP is on.
        desktop:
          type: boolean
          description: The Linux desktop is on.
        feature_error:
          type: string
          description: Only on a create or fork whose browser or desktop could not be switched on; the
            sandbox was made.
        created_by:
          description: The member who created or forked it; null for sandboxes made before this was recorded.
          oneOf:
          - type: 'null'
          - type: object
            required:
            - member_id
            - email
            properties:
              member_id:
                type: string
                example: mem_ilvsd743b36wqi26
              email:
                type: string
                description: Kept after the member leaves the workspace.
    CreateSandboxRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
        vcpus:
          type: integer
          enum:
          - 2
          - 4
          - 8
          - 16
          default: 2
          description: 'Picks the size: small 2 vCPU / 4096 MB / 50 GB, default 4 / 8192 / 50, large 8
            / 16384 / 110, xlarge 16 / 32768 / 250. Other values give 400 `invalid_request`.'
        ram_mb:
          type: integer
          enum:
          - 4096
          - 8192
          - 16384
          - 32768
          description: Optional. Must match the size's RAM.
        disk_gb:
          type: integer
          enum:
          - 50
          - 110
          - 250
          description: Optional. Must match the size's disk.
        region:
          type: string
          enum:
          - eu-central
          default: eu-central
          description: '`eu-central` is the only region today. US East is coming soon.'
        git_repo:
          type: string
          maxLength: 512
        git_branch:
          type: string
          maxLength: 255
        pr_number:
          type: integer
          minimum: 1
        max_cost_micros:
          type: integer
          format: int64
          minimum: 0
        image:
          type: string
          description: 'A ready custom image of the workspace (img_ id or name). It fixes

            the size and region: other values give 400.

            '
        browser:
          type: boolean
          description: Switch the browser on; omitted means the workspace default.
        desktop:
          type: boolean
          description: Switch the desktop on; omitted means the workspace default.
    CreateImageRequest:
      type: object
      additionalProperties: false
      required:
      - name
      description: Exactly one of `dockerfile` and `setup`.
      properties:
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9._-]{0,62}$
        dockerfile:
          type: string
          maxLength: 65536
          description: 'FROM zode/base (or ubuntu:24.04) runs each instruction in the VM;

            any other FROM is built with docker build inside the VM. No build

            context: COPY and ADD of local files are refused.

            '
        setup:
          $ref: '#/components/schemas/ImageSetup'
        vcpus:
          type: integer
          enum:
          - 2
          - 4
          - 8
          - 16
          default: 2
          description: 'Picks the size: small 2 vCPU / 4096 MB / 50 GB, default 4 / 8192 / 50, large 8
            / 16384 / 110, xlarge 16 / 32768 / 250. Other values give 400 `invalid_request`.'
        ram_mb:
          type: integer
          enum:
          - 4096
          - 8192
          - 16384
          - 32768
          description: Optional. Must match the size's RAM.
        region:
          type: string
          enum:
          - eu-central
          default: eu-central
          description: '`eu-central` is the only region today. US East is coming soon.'
        timeout_minutes:
          type: integer
          minimum: 1
          maximum: 60
          default: 30
    ImageSetup:
      type: object
      properties:
        run:
          type: array
          maxItems: 200
          items:
            type: string
          description: Shell commands
          run in order with bash.: null
        env:
          type: object
          additionalProperties:
            type: string
          description: Kept for every shell in the sandbox.
        workdir:
          type: string
          description: Absolute path; created
          and the directory of the commands.: null
        start:
          type: string
          description: Started before the freeze
          so it is already running when a sandbox boots.: null
        ready:
          type: string
          description: Checked every second after start until it exits 0.
    CustomImage:
      type: object
      required:
      - id
      - name
      - status
      - error
      - source_kind
      - vcpus
      - ram_mb
      - disk_gb
      - base
      - region
      - log_bytes
      - created_by
      - created_at
      - finished_at
      properties:
        id:
          type: string
          pattern: ^img_[a-z2-7]{16}$
        name:
          type: string
        status:
          type: string
          enum:
          - building
          - ready
          - failed
        error:
          type:
          - string
          - 'null'
        source_kind:
          type: string
          enum:
          - dockerfile
          - setup
        vcpus:
          type: integer
        ram_mb:
          type: integer
        disk_gb:
          type: integer
        base:
          type:
          - string
          - 'null'
          description: The base golden it was built from.
        region:
          type: string
        log_bytes:
          type: integer
          format: int64
        created_by:
          oneOf:
          - type: 'null'
          - type: object
            required:
            - member_id
            - email
            properties:
              member_id:
                type: string
              email:
                type: string
        created_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        dockerfile:
          type: string
          description: GET one image and create only.
        setup:
          $ref: '#/components/schemas/ImageSetup'
        warnings:
          type: array
          items:
            type: string
          description: Create only. Instructions that do nothing in Zode.
    Snapshot:
      type: object
      required:
      - id
      - sandbox_id
      - sandbox_name
      - name
      - include_ram
      - created_by
      - created_at
      properties:
        id:
          type: string
          pattern: ^snp_[a-z2-7]{16}$
        sandbox_id:
          type: string
        sandbox_name:
          type: string
        name:
          type: string
        include_ram:
          type: boolean
        created_by:
          oneOf:
          - type: 'null'
          - type: object
            required:
            - member_id
            - email
            properties:
              member_id:
                type: string
              email:
                type: string
        created_at:
          type: string
          format: date-time
    Images:
      type: object
      required:
      - images
      - fixed
      - regions
      - custom
      - can_build
      - limits
      properties:
        images:
          type: array
          items:
            type: object
            required:
            - name
            - vcpus
            - ram_mb
            - disk_gb
            - default
            properties:
              name:
                type:
                - string
                - 'null'
                example: small-v4
                description: The golden image name on the nodes.
              vcpus:
                type: integer
              ram_mb:
                type: integer
              disk_gb:
                type: integer
              default:
                type: boolean
        fixed:
          type: boolean
        regions:
          type: array
          items:
            type: string
        custom:
          type: array
          items:
            $ref: '#/components/schemas/CustomImage'
        can_build:
          type: boolean
        limits:
          type: object
          required:
          - plan
          - max_images
          - max_builds
          - images
          - building
          properties:
            plan:
              type: string
            max_images:
              type: integer
              description: 0 is unlimited.
            max_builds:
              type: integer
              description: Builds at once; 0 is unlimited.
            images:
              type: integer
            building:
              type: integer
    ForkSandboxRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
        git_branch:
          type: string
          maxLength: 255
          description: Defaults to the parent's.
        pr_number:
          type: integer
          minimum: 1
          description: Defaults to the parent's.
        max_cost_micros:
          type: integer
          format: int64
          minimum: 0
          description: Defaults to the parent's.
        browser:
          type: boolean
          description: Defaults to the parent's.
        desktop:
          type: boolean
          description: Defaults to the parent's.
    WhoAmI:
      type: object
      required:
      - org
      - member
      - token_id
      - platform_admin
      properties:
        org:
          type: object
          required:
          - id
          - name
          - plan
          properties:
            id:
              type: string
            name:
              type: string
            plan:
              type: string
              enum:
              - free
              - pro
              - team
              - enterprise
        member:
          type: object
          required:
          - id
          - email
          - role
          properties:
            id:
              type: string
            email:
              type: string
            role:
              type: string
              enum:
              - owner
              - admin
              - billing
              - member
        token_id:
          type: string
        platform_admin:
          type: boolean
    AuditEvent:
      type: object
      required:
      - id
      - actor
      - action
      - target_type
      - target_id
      - outcome
      - detail
      - created_at
      properties:
        id:
          type: integer
          format: int64
        org_id:
          type: string
        actor:
          type: string
          description: '`member:<id> token:<id>` for an API token; the member''s email for a console user.'
          example: member:mem_x token:tok_y
        action:
          type: string
          description: 'One of org.create, token.create, token.revoke, org.delete, org.key_destroy,

            sandbox.create, sandbox.fork, sandbox.stop, sandbox.start,

            sandbox.delete, node.add.

            '
        target_type:
          type: string
        target_id:
          type: string
        outcome:
          type: string
          enum:
          - ok
          - denied
          - error
        detail:
          type: object
          additionalProperties: true
        ip:
          type: string
          description: The caller's address; empty for events written outside a request.
        created_at:
          type: string
          format: date-time
    OrgDetail:
      type: object
      required:
      - id
      - name
      - display_name
      - plan
      - personal
      - billing_email
      - created_at
      - role
      - member_count
      properties:
        id:
          type: string
        name:
          type: string
          description: Unique slug (CLI).
        display_name:
          type: string
        plan:
          type: string
          enum:
          - free
          - pro
          - team
          - enterprise
        personal:
          type: boolean
        billing_email:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        role:
          type: string
          enum:
          - owner
          - admin
          - billing
          - member
          description: The caller's role.
        member_count:
          type: integer
        browser_default:
          type: boolean
          description: New sandboxes get the browser.
        desktop_default:
          type: boolean
          description: New sandboxes get the desktop.
        plan_allows:
          type: object
          required:
          - browser
          - desktop
          properties:
            browser:
              type: boolean
            desktop:
              type: boolean
    UpdateOrgRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
        display_name:
          type: string
          minLength: 1
          maxLength: 64
          description: Trimmed.
        billing_email:
          type: string
          description: '"" clears it.'
        browser_default:
          type: boolean
          description: 403 plan_required when the plan does not include it.
        desktop_default:
          type: boolean
          description: 403 plan_required when the plan does not include it.
    Member:
      type: object
      required:
      - id
      - email
      - name
      - role
      - user_id
      - joined_at
      - last_active_at
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type:
          - string
          - 'null'
          description: The linked user's name.
        role:
          type: string
          enum:
          - owner
          - admin
          - billing
          - member
        user_id:
          type:
          - string
          - 'null'
          description: Null until a person signs in as this member.
        joined_at:
          type: string
          format: date-time
        last_active_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Latest session activity of the user or token use of the member.
    Invite:
      type: object
      required:
      - id
      - email
      - role
      - invited_by
      - created_at
      - expires_at
      properties:
        id:
          type: string
          pattern: ^inv_[a-z2-7]{16}$
        email:
          type: string
        role:
          type: string
          enum:
          - admin
          - billing
          - member
        invited_by:
          type: string
          description: Inviter's email.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    TokenInfo:
      type: object
      required:
      - id
      - name
      - created_at
      - last_used_at
      - created_by_email
      - prefix
      - scope
      - expires_at
      - expired
      properties:
        id:
          type: string
        name:
          type: string
          description: Empty for tokens made before names existed.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated at most once a minute.
        created_by_email:
          type: string
          description: Email of the member the token belongs to.
        prefix:
          type: string
          description: First 12 characters of the token, e.g. zode_tok_3fa.
        scope:
          $ref: '#/components/schemas/TokenScope'
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Null when it never expires.
        expired:
          type: boolean
          description: 'Past expires_at: it gets 401 like an unknown token.'
    TokenScope:
      type: string
      enum:
      - full
      - read_only
      - sandboxes
      description: 'What the key may call. `full`: everything its member''s role allows.

        `read_only`: GET and HEAD only, and never attach (a session).

        `sandboxes`: only /v1/sandboxes* and /v1/whoami. Anything else is

        403 `token_scope` (not audited, like the other auth refusals).

        '
    CreateTokenRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Printable; trimmed.
        scope:
          $ref: '#/components/schemas/TokenScope'
        expires_in_days:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 365
          description: Absent or null for a key that never expires.
    CreatedToken:
      type: object
      required:
      - id
      - name
      - token
      - scope
      - expires_at
      properties:
        id:
          type: string
        name:
          type: string
        token:
          type: string
          description: zode_tok_<64 hex>. Shown once; store it now.
        scope:
          $ref: '#/components/schemas/TokenScope'
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
    TokenRevoked:
      type: object
      required:
      - id
      - revoked
      properties:
        id:
          type: string
        revoked:
          type: boolean
          const: true
    Environment:
      type: object
      required:
      - id
      - name
      - default
      - variables
      - secrets
      - created_at
      properties:
        id:
          type: string
        name:
          type: string
        default:
          type: boolean
        variables:
          type: integer
        secrets:
          type: integer
        created_at:
          type: string
          format: date-time
    SecretsStatus:
      type: object
      required:
      - writable
      - delivered
      properties:
        writable:
          type: boolean
          description: False when the server has no secrets key; writes get 503.
        delivered:
          type: boolean
          description: 'True when the server can open secrets and the fleet''s nodes run the vault: each
            sandbox''s proxy gets them and sessions see only the dummies. False: stored only.'
    Variable:
      type: object
      required:
      - name
      - value
      - updated_at
      - updated_by
      properties:
        name:
          type: string
        value:
          type: string
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
    Secret:
      type: object
      required:
      - name
      - allowed_hosts
      - created_at
      - updated_at
      - updated_by
      - last_used_at
      properties:
        name:
          type: string
        allowed_hosts:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
