              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '201':
          description: Created; `token` is shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedToken'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /v1/tokens/{id}:
    delete:
      operationId: revokeToken
      tags:
      - Workspace
      summary: Revoke an API key
      description: 'Revoke an API token.


        Owners and admins may revoke any token of the org; billing and

        member roles only their own. From then on the token gets the same 401 as an

        unknown one. An unknown, already revoked or other org''s token is 404.'
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRevoked'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^tok_[a-z2-7]{16}$
  /v1/ci:
    get:
      operationId: getCI
      tags:
      - CI
      summary: Get CI setup
      description: 'CI setup, runner sizes, linked GitHub installations, monthly cap and spend (any role).


        `configured` is false when this Zode has no GitHub App; then

        `app_slug` is null and `installations` empty. Repositories are read

        live from GitHub (cached a minute); a failed read sets

        `repos_error`. `spent_micros` is this UTC month''s runner compute,

        including what live runners have run up so far.'
      responses:
        '200':
          description: CI state
          content:
            application/json:
              schema:
                type: object
                required:
                - configured
                - app_slug
                - sizes
                - installations
                - monthly_cap_micros
                - spent_micros
                - month_start
                properties:
                  configured:
                    type: boolean
                  app_slug:
                    type:
                    - string
                    - 'null'
                  sizes:
                    type: array
                    items:
                      type: object
                      required:
                      - label
                      - vcpus
                      - ram_mb
                      - disk_gb
                      - default
                      properties:
                        label:
                          type: string
                          examples:
                          - zode-4x8
                        vcpus:
                          type: integer
                        ram_mb:
                          type: integer
                        disk_gb:
                          type: integer
                        default:
                          type: boolean
                          description: the size plain `zode` gets
                  installations:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - account
                      - account_type
                      - repository_selection
                      - suspended
                      - installed_by
                      - created_at
                      - manage_url
                      - repos
                      - repos_more
                      - repos_error
                      properties:
                        id:
                          type: integer
                          description: GitHub installation id
                        account:
                          type: string
                        account_type:
                          type: string
                          enum:
                          - User
                          - Organization
                        repository_selection:
                          type: string
                          enum:
                          - all
                          - selected
                        suspended:
                          type: boolean
                        installed_by:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        manage_url:
                          type: string
                          format: uri
                        repos:
                          type: array
                          items:
                            type: object
                            required:
                            - full_name
                            - private
                            properties:
                              full_name:
                                type: string
                              private:
                                type: boolean
                        repos_more:
                          type: boolean
                          description: the list stopped at 1000
                        repos_error:
                          type:
                          - string
                          - 'null'
                  monthly_cap_micros:
                    type:
                    - integer
                    - 'null'
                  spent_micros:
                    type: integer
                  month_start:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /v1/ci/jobs:
    get:
      operationId: listCIJobs
      tags:
      - CI
      summary: List CI jobs
      description: 'GitHub Actions jobs that asked for a Zode runner, newest first (any role).


        `status`: queued, provisioning, waiting (runner up, job not started),

        running, completed (`conclusion` from GitHub), refused (`reason`:

        cap reached, unknown size, app suspended) or failed (`reason`: Zode

        could not start the runner). `cost_micros` is the runner sandbox''s

        metered compute; `cost_final` false means it is still running up.'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                required:
                - jobs
                properties:
                  jobs:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - repo
                      - branch
                      - workflow
                      - job
                      - url
                      - labels
                      - size
                      - status
                      - conclusion
                      - reason
                      - sandbox_id
                      - cache_hit
                      - cost_micros
                      - cost_final
                      - queued_at
                      - started_at
                      - completed_at
                      - duration_ms
                      properties:
                        id:
                          type: string
                          pattern: ^cij_[a-z2-7]{16}$
                        repo:
                          type: string
                        branch:
                          type: string
                        workflow:
                          type: string
                        job:
                          type: string
                        url:
                          type: string
                          format: uri
                          description: the job on GitHub
                        labels:
                          type: array
                          items:
                            type: string
                        size:
                          type:
                          - string
                          - 'null'
                          examples:
                          - 4x8
                        status:
                          type: string
                          enum:
                          - queued
                          - provisioning
                          - waiting
                          - running
                          - completed
                          - refused
                          - failed
                        conclusion:
                          type:
                          - string
                          - 'null'
                        reason:
                          type:
                          - string
                          - 'null'
                        sandbox_id:
                          type:
                          - string
                          - 'null'
                        cache_hit:
                          type: boolean
                        cost_micros:
                          type: integer
                        cost_final:
                          type: boolean
                        queued_at:
                          type: string
                          format: date-time
                        started_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        completed_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        duration_ms:
                          type:
                          - integer
                          - 'null'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /v1/ci/settings:
    patch:
      operationId: updateCISettings
      tags:
      - CI
      summary: Set the monthly cap
      description: 'Set or clear the monthly CI cap (owner, admin).


        Past the cap, new jobs are refused (status `refused`, the reason

        says so); running jobs finish. Audited as `ci.cap` with old and new.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - monthly_cap_micros
              properties:
                monthly_cap_micros:
                  type:
                  - integer
                  - 'null'
                  minimum: 0
                  maximum: 1000000000000
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required:
                - monthly_cap_micros
                properties:
                  monthly_cap_micros:
                    type:
                    - integer
                    - 'null'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /v1/webhooks:
    get:
      operationId: listWebhooks
      tags:
      - Webhooks
      summary: List endpoints
      responses:
        '200':
          description: Endpoints (never their secrets)
          content:
            application/json:
              schema:
                type: object
                required:
                - webhooks
                - event_types
                - limit
                - available
                properties:
                  webhooks:
                    type: array
                    items:
                      type: object
                      description: 'WebhookView: id, url, description, event_types, enabled, disabled_reason
                        (null|manual|failing), failing_since, created_at, updated_at'
                  event_types:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        group:
                          type: string
                        description:
                          type: string
                        available:
                          type: boolean
                          description: 'false: selectable now, sent once the feature ships'
                  limit:
                    type: integer
                    example: 10
                  available:
                    type: boolean
                    description: 'false: the server has no secrets key; writes answer 503'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      description: The workspace's webhook endpoints, the event catalogue and the cap.
    post:
      operationId: createWebhook
      tags:
      - Webhooks
      summary: Add an endpoint
      description: 'Add an endpoint; the signing secret is in this response only.


        `url` must be https and resolve only to public addresses (private,

        loopback, link-local and metadata addresses are refused here and

        again at every delivery). At most 10 per workspace (409

        `limit_reached`). 503 `secrets_unavailable` without ZODE_SECRETS_KEY.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              - event_types
              properties:
                url:
                  type: string
                  example: https://hooks.example.com/zode
                description:
                  type: string
                  maxLength: 200
                event_types:
                  type: array
                  items:
                    type: string
                enabled:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Created; `secret` (whsec_...) is shown once
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/webhooks/{id}:
    get:
      operationId: getWebhook
      tags:
      - Webhooks
      summary: Get an endpoint
      responses:
        '200':
          description: The endpoint
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      description: One endpoint.
    patch:
      operationId: updateWebhook
      tags:
      - Webhooks
      summary: Change an endpoint
      description: 'Change url, description, event_types or enabled (any subset).


        `enabled: false` fails the endpoint''s queued deliveries; `true` turns

        on an endpoint Zode disabled after 3 days of failures.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                description:
                  type: string
                event_types:
                  type: array
                  items:
                    type: string
                enabled:
                  type: boolean
      responses:
        '200':
          description: The endpoint
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteWebhook
      tags:
      - Webhooks
      summary: Remove an endpoint
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      description: Remove an endpoint; queued deliveries fail.
